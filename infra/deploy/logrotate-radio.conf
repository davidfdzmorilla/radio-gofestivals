# Rotación de /var/log/radio (los logs son de david; se ejecuta desde su crontab,
# sin root). Ver infra/deploy/README.md.
#
# copytruncate: los cron jobs escriben con `>>` y el contenedor/cron mantiene el
# fichero abierto; renombrar lo dejaría escribiendo en el fichero rotado.
# El `find -mtime +14 -delete` anterior nunca borraba los logs activos, porque su
# mtime se renueva con cada escritura.
/var/log/radio/*.log {
    daily
    rotate 14
    maxsize 50M
    compress
    dateext
    missingok
    notifempty
    copytruncate
    su david david
}
